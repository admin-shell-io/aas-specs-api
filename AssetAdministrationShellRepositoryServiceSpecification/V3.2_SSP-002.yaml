    get:
      tags:
        - Asset Administration Shell Repository API
      summary: Downloads file content from a specific submodel element from the Submodel at a specified path
      description: >-
        Returns managed file content with 200 OK. If File.value is an
        absolute HTTP(S) URL, returns 302 Found with that URL in the Location
        header. The server shall enforce authorization before returning the
        redirect and shall not fetch or check the external resource. The client
        can follow the redirect subject to its own security policy and the
        external server's authorization. For non-HTTP(S) locations, returns
        404 Not Found if no corresponding managed file is available. A missing
        location also results in 404 Not Found.
      operationId: GetFileByPath_AasRepository
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetFileByPath/3/2
      responses:
        '200':
          description: Requested file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: In order to physically download the file usually set to attachment with a filename
              example: 'attachment; filename="filename.jpg"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          $ref: '../Part2-API-Schemas/openapi.yaml#/components/responses/external-file-redirect'
        '400':
          $ref: '../Part2-API-Schemas/openapi.yaml#/components/responses/bad-request'
