            border: 2px solid #0028CD;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 400px;
        }

        .spec-selector select option:disabled {
            color: #999;
            font-style: italic;
        }

        #redoc-container {
            height: calc(100vh - 122px);
        }

        @media (max-width: 768px) {
            .custom-header {
                flex-direction: column;
                gap: 1rem;
            }

            .spec-selector select {
                min-width: 100%;
            }
        }
    </style>
</head>

    <div id="redoc-container"></div>

    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    <script>
        // Auto-detect path prefix for local vs GitHub Pages
        function getPathPrefix() {
            const path = window.location.pathname;
            if (path.includes('/docs/')) {
                return '../'; // Local: go up from docs/ to repo root
            }
            return '/'; // GitHub Pages: specs are at root level
        }

        // Get base path for the repository
        function getBasePath() {
            const path = window.location.pathname;
            const match = path.match(/^(\/[^\/]+)\//);
            if (match && !path.startsWith('/docs/')) {
                return match[1];
            }
            return '';
        }

        // Adjust path based on environment
        function adjustSpecPath(url) {
            // If it's already a full GitHub URL, return as-is
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return url;
            }

            const pathPrefix = getPathPrefix();
            const basePath = getBasePath();

            if (url.startsWith('../')) {
                if (pathPrefix === '/') {
                    return basePath + '/' + url.substring(3);
                } else {
                    return url;
                }
            }
            return url;
        }

        // Get URL parameter or default
        const urlParams = new URLSearchParams(window.location.search);
        let specUrl = urlParams.get('url') || '../AssetAdministrationShellRegistryServiceSpecification/V3.2_SSP-001.yaml';
        const version = urlParams.get('version') || 'v3.2.0';

        // Initialize Redoc
        function initRedoc(url) {
            const adjustedUrl = adjustSpecPath(url);
            Redoc.init(
                adjustedUrl,
                {
                    scrollYOffset: 122,
                    hideDownloadButton: false,
                    disableSearch: false,
                    theme: {
                        colors: {
                            primary: {
                                main: '#0028CD'
                            }
                        },
                        typography: {
                            fontSize: '15px',
                            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
                            headings: {
                                fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
                            }
                        },
                        sidebar: {
                            backgroundColor: '#fafafa',
                            width: '260px'
                        },
                        logo: {
                            gutter: '20px'
                        }
                    }
                },
                document.getElementById('redoc-container')
            );
        }

        // Initialize with current spec
        initRedoc(specUrl);

        // Set dropdown to current spec
        const select = document.getElementById('specSelect');
        select.value = specUrl;

        // Handle spec changes
        select.addEventListener('change', function(e) {
            const newUrl = e.target.value;
            // Update URL without reload
            const newUrlParams = new URLSearchParams(window.location.search);
            newUrlParams.set('url', newUrl);
            window.history.pushState({}, '', `${window.location.pathname}?${newUrlParams}`);

            // Clear and reinitialize Redoc
            const container = document.getElementById('redoc-container');
            container.innerHTML = '';
            initRedoc(newUrl);

            // Update Swagger link
            updateSwaggerLink(newUrl);
        });

        // Update Swagger link
        function updateSwaggerLink(url) {
            document.getElementById('swaggerLink').href = `swagger-ui.html?url=${encodeURIComponent(url)}&version=${version}`;
        }

        updateSwaggerLink(specUrl);
    </script>
</body>
