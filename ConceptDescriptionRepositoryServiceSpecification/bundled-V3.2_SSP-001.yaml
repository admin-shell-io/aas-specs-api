        - $ref: '#/components/schemas/MultiLanguageProperty'
        - $ref: '#/components/schemas/Operation'
        - $ref: '#/components/schemas/Property'
        - $ref: '#/components/schemas/Range'
        - $ref: '#/components/schemas/ReferenceElement'
        - $ref: '#/components/schemas/SubmodelElementCollection'
        - $ref: '#/components/schemas/SubmodelElementList'
    EntityType:
      type: string
      enum:
        - CoManagedEntity
        - SelfManagedEntity
    Entity:
      allOf:
        - $ref: '#/components/schemas/SubmodelElement'
        - properties:
            statements:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubmodelElement_choice'
            entityType:
              $ref: '#/components/schemas/EntityType'
            globalAssetId:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
            specificAssetIds:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SpecificAssetId'
            modelType:
              pattern: ^Entity$
    OperationVariable:
      type: object
      required:
        - value
      properties:
        value:
          $ref: '#/components/schemas/SubmodelElement_choice'
    Operation:
      allOf:
        - $ref: '#/components/schemas/SubmodelElement'
        - properties:
            inputVariables:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OperationVariable'
            outputVariables:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OperationVariable'
            inoutputVariables:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OperationVariable'
            modelType:
              pattern: ^Operation$
    SubmodelElementCollection:
      allOf:
        - $ref: '#/components/schemas/SubmodelElement'
        - properties:
            value:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubmodelElement_choice'
            modelType:
              pattern: ^SubmodelElementCollection$
    AasSubmodelElements:
      type: string
      enum:
        - AnnotatedRelationshipElement
        - BasicEventElement
        - Blob
        - Capability
        - DataElement
        - Entity
        - EventElement
        - File
        - MultiLanguageProperty
        - Operation
        - Property
        - Range
        - ReferenceElement
        - RelationshipElement
        - SubmodelElement
        - SubmodelElementCollection
        - SubmodelElementList
    SubmodelElementList:
      allOf:
        - $ref: '#/components/schemas/SubmodelElement'
        - required:
            - typeValueListElement
          properties:
            orderRelevant:
              type: boolean
            semanticIdListElement:
              $ref: '#/components/schemas/Reference'
            typeValueListElement:
              $ref: '#/components/schemas/AasSubmodelElements'
            valueTypeListElement:
              $ref: '#/components/schemas/DataTypeDefXsd'
            value:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubmodelElement_choice'
            modelType:
              pattern: ^SubmodelElementList$
    Submodel:
      allOf:
        - $ref: '#/components/schemas/Identifiable'
        - $ref: '#/components/schemas/HasKind'
        - $ref: '#/components/schemas/HasSemantics'
        - $ref: '#/components/schemas/Qualifiable'
        - $ref: '#/components/schemas/HasDataSpecification'
        - properties:
            submodelElements:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SubmodelElement_choice'
            modelType:
              pattern: ^Submodel$
    Environment:
      type: object
      properties:
        assetAdministrationShells:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AssetAdministrationShell'
        submodels:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Submodel'
        conceptDescriptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ConceptDescription'
    ServiceDescription:
      description: The Description object enables servers to present their capabilities to the clients, in particular which profiles they implement. At least one defined profile is required. Additional, proprietary attributes might be included. Nevertheless, the server must not expect that a regular client understands them.
      example: |-
        {
          "profiles": [
            "https://admin-shell.io/aas/API/3/2/AssetAdministrationShellRegistryServiceSpecification/SSP-002",
            "https://admin-shell.io/aas/API/3/2/SubmodelRegistryServiceSpecification/SSP-002"
          ]
        }
      properties:
        profiles:
          type: array
          description: The list of profiles implemented by the server. The profiles are identified by their URI. Note that the list of example profiles is not exhaustive, but only includes the profiles defined in the current version of the specification. The server might also include proprietary profiles, which are not defined in the specification. Clients should be designed to ignore unknown profiles, but might use them to implement additional functionality if they are known.
