openapi: 3.1.0
info:
  title: DotAAS Part 2 | HTTP/REST | Bulk Asset Administration Shell Registry Service Specification
  description: |-
    The Bulk Profile of the Asset Administration Shell Registry Service Specification as part of the [Specification of the Asset Administration Shell: Part 2](https://industrialdigitaltwin.org/content-hub/aasspecifications).  
    The server processes all requests asynchronously, ensuring atomic operations. This means that requested manipulations will either fully succeed or be completely rolled back if any error occurs during the process.  
    Copyright: Industrial Digital Twin Association (IDTA) 2025
  contact:
    name: Industrial Digital Twin Association (IDTA)
    email: info@idtwin.org
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  version: V3.2.0_SSP-003
  x-profile-identifier: https://admin-shell.io/aas/API/3/2/AssetAdministrationShellRegistryServiceSpecification/SSP-003
servers:
  - url: https://admin-shell.io/api/v3/
  - url: https://example.com/
paths:
  /bulk/shell-descriptors:
    post:
      tags:
        - Async Bulk Asset Administration Shell Registry API
      summary: Creates multiple new Asset Administration Shell Descriptors, i.e. registers multiple Asset Administration Shells
      operationId: CreateBulkAssetAdministrationShellDescriptors
      x-semanticIds:
        - https://admin-shell.io/aas/API/CreateBulkAssetAdministrationShellDescriptors/3/2
      requestBody:
        description: List of Asset Administration Shell Descriptor objects
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/AssetAdministrationShellDescriptor'
        required: true
      responses:
        '202':
          $ref: '#/components/responses/accepted'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
    put:
      tags:
        - Async Bulk Asset Administration Shell Registry API
      summary: Creates or updates multiple existing Asset Administration Shell Descriptors
      operationId: PutBulkAssetAdministrationShellDescriptorsById
      x-semanticIds:
        - https://admin-shell.io/aas/API/PutBulkAssetAdministrationShellDescriptorsById/3/2
      requestBody:
        description: List of Asset Administration Shell Descriptor objects
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/AssetAdministrationShellDescriptor'
        required: true
      responses:
        '202':
          $ref: '#/components/responses/accepted'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
    delete:
      tags:
        - Async Bulk Asset Administration Shell Registry API
      summary: Deletes multiple Asset Administration Shell Descriptors, i.e. de-registers multiple Asset Administration Shells
      operationId: DeleteBulkAssetAdministrationShellDescriptorsById
      x-semanticIds:
        - https://admin-shell.io/aas/API/DeleteBulkAssetAdministrationShellDescriptorsById/3/2
      requestBody:
        description: List of Asset Administration Shell Identifiers
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                type: string
      responses:
        '202':
          $ref: '#/components/responses/accepted'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bulk/status/{handleId}:
    get:
      tags:
        - Async Bulk Status API
      summary: Returns the status of an asynchronously invoked bulk operation
      operationId: GetAsyncBulkStatus
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetAsyncBulkStatus/3/2
      parameters:
        - in: path
          name: handleId
          schema:
            $ref: '#/components/schemas/HandleId'
          required: true
      responses:
        '200':
          description: Bulk operation result object containing information that the 'executionState' is still 'Running'
          headers:
            Retry-After:
              schema:
                type: integer
              required: false
              description: The number of seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOperationResult'
        '302':
          $ref: '#/components/responses/found'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bulk/result/{handleId}:
    get:
      tags:
        - Async Bulk Result API
      summary: Returns the result object of an asynchronously invoked bulk operation
      operationId: GetBulkAsyncResult
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetBulkAsyncResult/3/2
      parameters:
        - in: path
          name: handleId
          schema:
            $ref: '#/components/schemas/HandleId'
          required: true
      responses:
        '204':
          description: The bulk request itself was correct and all elements have been processed. The server may remove the result resource after  it was requested once (by any client) or after a certain time period.
        '400':
          description: There was an error in the processing of the request. Either the bulk request itself was not correct, or at least of it's part requests. The whole transaction has been rolled back.
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          description: The handleId is not known to the server. This means either it never came into existence or it was successfully completed a considerable time in the past.
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /description:
    get:
      tags:
        - Description API
      summary: Returns the self-describing information of a network resource (ServiceDescription)
      operationId: GetSelfDescription
      x-semanticIds:
        - https://admin-shell.io/aas/API/GetSelfDescription/3/2
      responses:
        '200':
          description: Requested Description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDescription'
        '403':
          $ref: '#/components/responses/forbidden'
        default:
          $ref: '#/components/responses/default'
components:
  schemas:
    AbstractLangString:
      type: object
      required:
        - language
        - text
      properties:
        language:
          type: string
          pattern: ^(([a-zA-Z]{2,3}(-[a-zA-Z]{3}(-[a-zA-Z]{3}){0,2})?|[a-zA-Z]{4}|[a-zA-Z]{5,8})(-[a-zA-Z]{4})?(-([a-zA-Z]{2}|[0-9]{3}))?(-(([a-zA-Z0-9]){5,8}|[0-9]([a-zA-Z0-9]){3}))*(-[0-9A-WY-Za-wy-z](-([a-zA-Z0-9]){2,8})+)*(-[xX](-([a-zA-Z0-9]){1,8})+)?|[xX](-([a-zA-Z0-9]){1,8})+|((en-GB-oed|i-ami|i-bnn|i-default|i-enochian|i-hak|i-klingon|i-lux|i-mingo|i-navajo|i-pwn|i-tao|i-tay|i-tsu|sgn-BE-FR|sgn-BE-NL|sgn-CH-DE)|(art-lojban|cel-gaulish|no-bok|no-nyn|zh-guoyu|zh-hakka|zh-min|zh-min-nan|zh-xiang)))$
        text:
          type: string
          pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
          minLength: 1
    LangStringTextType:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 1023
    LangStringNameType:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 128
    ReferenceTypes:
      type: string
      enum:
        - ExternalReference
        - ModelReference
    Reference:
      type: object
      required:
        - type
        - keys
      properties:
        type:
          $ref: '#/components/schemas/ReferenceTypes'
        referredSemanticId:
          $ref: '#/components/schemas/Reference'
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Key'
    KeyTypes:
      type: string
      enum:
        - AnnotatedRelationshipElement
        - AssetAdministrationShell
        - BasicEventElement
        - Blob
        - Capability
        - ConceptDescription
        - DataElement
        - Entity
        - EventElement
        - File
        - FragmentReference
        - GlobalReference
        - Identifiable
        - MultiLanguageProperty
        - Operation
        - Property
        - Range
        - Referable
        - ReferenceElement
        - RelationshipElement
        - Submodel
        - SubmodelElement
        - SubmodelElementCollection
        - SubmodelElementList
    Key:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/KeyTypes'
        value:
          type: string
          pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
          minLength: 1
          maxLength: 2048
    HasSemantics:
      type: object
      properties:
        semanticId:
          $ref: '#/components/schemas/Reference'
        supplementalSemanticIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Reference'
    DataTypeDefXsd:
      type: string
      enum:
        - xs:anyURI
        - xs:base64Binary
        - xs:boolean
        - xs:byte
        - xs:date
        - xs:dateTime
        - xs:decimal
        - xs:double
        - xs:duration
        - xs:float
        - xs:gDay
        - xs:gMonth
        - xs:gMonthDay
        - xs:gYear
        - xs:gYearMonth
        - xs:hexBinary
        - xs:int
        - xs:integer
        - xs:long
        - xs:negativeInteger
        - xs:nonNegativeInteger
        - xs:nonPositiveInteger
        - xs:positiveInteger
        - xs:short
        - xs:string
        - xs:time
        - xs:unsignedByte
        - xs:unsignedInt
        - xs:unsignedLong
        - xs:unsignedShort
    Extension:
      allOf:
        - $ref: '#/components/schemas/HasSemantics'
        - required:
            - name
          properties:
            name:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 128
            valueType:
              $ref: '#/components/schemas/DataTypeDefXsd'
            value:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
            refersTo:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Reference'
    Descriptor:
      example: '{ "endpoints": [ { "protocolInformation": { "href": "https://localhost:1234/api/v3.0/aas", "endpointProtocolVersion": ["1.1"] }, "interface": "AAS-3.0" }, { "protocolInformation": { "href": "opc.tcp://localhost:4840" }, "interface": "AAS-3.0" }, { "protocolInformation": { "href": "https://localhost:5678", "endpointProtocolVersion": ["1.1"], "subprotocol": "OPC UA Basic SOAP", "subprotocolBody": "ns=2;s=MyAAS", "subprotocolBodyEncoding": "application/soap+xml" }, "interface": "AAS-3.0" } ] }'
      properties:
        description:
          type: array
          items:
            $ref: '#/components/schemas/LangStringTextType'
        displayName:
          type: array
          items:
            $ref: '#/components/schemas/LangStringNameType'
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
          minItems: 1
      type: object
    ModelType:
      type: string
      enum:
        - AnnotatedRelationshipElement
        - AssetAdministrationShell
        - BasicEventElement
        - Blob
        - Capability
        - ConceptDescription
        - DataSpecificationIec61360
        - DataSpecificationUom
        - Entity
        - File
        - MultiLanguageProperty
        - Operation
        - Property
        - Range
        - ReferenceElement
        - RelationshipElement
        - Submodel
        - SubmodelElementCollection
        - SubmodelElementList
    DataSpecificationContent:
      type: object
      required:
        - modelType
      properties:
        modelType:
          $ref: '#/components/schemas/ModelType'
    LangStringPreferredNameTypeIec61360:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 255
    LangStringShortNameTypeIec61360:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 18
    DataTypeIec61360:
      type: string
      enum:
        - BLOB
        - BOOLEAN
        - DATE
        - FILE
        - HTML
        - INTEGER_COUNT
        - INTEGER_CURRENCY
        - INTEGER_MEASURE
        - IRDI
        - IRI
        - RATIONAL
        - RATIONAL_MEASURE
        - REAL_COUNT
        - REAL_CURRENCY
        - REAL_MEASURE
        - STRING
        - STRING_TRANSLATABLE
        - TIME
        - TIMESTAMP
    LangStringDefinitionTypeIec61360:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 1023
    ValueReferencePair:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
          minLength: 1
          maxLength: 2048
        valueId:
          $ref: '#/components/schemas/Reference'
    ValueList:
      type: object
      required:
        - valueReferencePairs
      properties:
        valueReferencePairs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ValueReferencePair'
    LevelType:
      type: object
      required:
        - min
        - nom
        - typ
        - max
      properties:
        min:
          type: boolean
        nom:
          type: boolean
        typ:
          type: boolean
        max:
          type: boolean
    DataSpecificationIec61360:
      allOf:
        - $ref: '#/components/schemas/DataSpecificationContent'
        - required:
            - preferredName
          properties:
            preferredName:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringPreferredNameTypeIec61360'
            shortName:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringShortNameTypeIec61360'
            unit:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
            unitId:
              $ref: '#/components/schemas/Reference'
            sourceOfDefinition:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
            symbol:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
            dataType:
              $ref: '#/components/schemas/DataTypeIec61360'
            definition:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringDefinitionTypeIec61360'
            valueFormat:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
            valueList:
              $ref: '#/components/schemas/ValueList'
            value:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
            levelType:
              $ref: '#/components/schemas/LevelType'
            modelType:
              pattern: ^DataSpecificationIec61360$
    LangStringUom:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 256
    LangStringDefinitionTypeUom:
      allOf:
        - $ref: '#/components/schemas/AbstractLangString'
        - properties:
            text:
              maxLength: 2048
    DataSpecificationUom:
      allOf:
        - $ref: '#/components/schemas/DataSpecificationContent'
        - required:
            - preferredName
            - symbol
          properties:
            preferredName:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringUom'
            symbol:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 256
            specificUnitId:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 256
            definition:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringDefinitionTypeUom'
            preferredNameQuantity:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LangStringUom'
            quantityId:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
            classificationSystem:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 256
            classificationSystemVersion:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 256
            modelType:
              pattern: ^DataSpecificationUom$
    DataSpecificationContent_choice:
      oneOf:
        - $ref: '#/components/schemas/DataSpecificationIec61360'
        - $ref: '#/components/schemas/DataSpecificationUom'
    EmbeddedDataSpecification:
      type: object
      required:
        - dataSpecification
        - dataSpecificationContent
      properties:
        dataSpecification:
          $ref: '#/components/schemas/Reference'
        dataSpecificationContent:
          $ref: '#/components/schemas/DataSpecificationContent_choice'
    HasDataSpecification:
      type: object
      properties:
        embeddedDataSpecifications:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmbeddedDataSpecification'
    AdministrativeInformation:
      allOf:
        - $ref: '#/components/schemas/HasDataSpecification'
        - properties:
            version:
              type: string
              allOf:
                - minLength: 1
                  maxLength: 4
                - pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
                - pattern: ^(0|[1-9][0-9]*)$
            revision:
              type: string
              allOf:
                - minLength: 1
                  maxLength: 4
                - pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
                - pattern: ^(0|[1-9][0-9]*)$
            creator:
              $ref: '#/components/schemas/Reference'
            createdAt:
              type: string
              pattern: ^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\.[0-9]+)?)|24:00:00(\.0+)?)(Z|\+00:00|-00:00)$
            updatedAt:
              type: string
              pattern: ^-?(([1-9][0-9][0-9][0-9]+)|(0[0-9][0-9][0-9]))-((0[1-9])|(1[0-2]))-((0[1-9])|([12][0-9])|(3[01]))T(((([01][0-9])|(2[0-3])):[0-5][0-9]:([0-5][0-9])(\.[0-9]+)?)|24:00:00(\.0+)?)(Z|\+00:00|-00:00)$
            templateId:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
    AssetKind:
      type: string
      enum:
        - Batch
        - Instance
        - NotApplicable
        - Role
        - Type
    ProtocolInformation:
      properties:
        href:
          type: string
          maxLength: 2048
        endpointProtocol:
          type: string
          maxLength: 128
        endpointProtocolVersion:
          type: array
          items:
            type: string
            maxLength: 128
        subprotocol:
          type: string
          maxLength: 128
        subprotocolBody:
          type: string
          maxLength: 2048
        subprotocolBodyEncoding:
          type: string
          maxLength: 128
        securityAttributes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - NONE
                  - RFC_TLSA
                  - W3C_DID
              key:
                type: string
              value:
                type: string
            required:
              - type
              - key
              - value
          minItems: 1
      required:
        - href
      type: object
    Endpoint:
      properties:
        interface:
          type: string
          maxLength: 128
        protocolInformation:
          $ref: '#/components/schemas/ProtocolInformation'
      required:
        - protocolInformation
        - interface
      type: object
    SpecificAssetId:
      allOf:
        - $ref: '#/components/schemas/HasSemantics'
        - required:
            - name
            - value
          properties:
            name:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 64
            value:
              type: string
              pattern: ^([\x09\x0a\x0d\x20-\ud7ff\ue000-\ufffd]|\ud800[\udc00-\udfff]|[\ud801-\udbfe][\udc00-\udfff]|\udbff[\udc00-\udfff])*$
              minLength: 1
              maxLength: 2048
            externalSubjectId:
              $ref: '#/components/schemas/Reference'
    SubmodelDescriptor:
      allOf:
        - $ref: '#/components/schemas/Descriptor'
      properties:
        administration:
          $ref: '#/components/schemas/AdministrativeInformation'
        endpoints:
          items:
            $ref: '#/components/schemas/Endpoint'
